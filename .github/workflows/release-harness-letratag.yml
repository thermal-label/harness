name: Release harness-letratag

# Builds the letratag harness app to a static bundle, zips dist/,
# and attaches it as a Release artifact named
# `harness-letratag-<tag>.zip`. The docs site CI's
# `pull-harness-bundles` step pulls the `latest`-tagged artifact and
# serves it under thermal-label.github.io/harness/letratag/.
#
# Triggered by tags matching `harness-letratag-v*`. Run locally
# (no auto-tag in this repo) by:
#   git tag harness-letratag-v0.1.0
#   git push origin harness-letratag-v0.1.0
#
# This workflow does NOT trigger releases automatically — the
# maintainer cuts tags by hand.

on:
  push:
    tags:
      - 'harness-letratag-v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build harness-letratag
        run: pnpm --filter @thermal-label/harness-letratag build

      - name: Determine artifact name
        id: artifact
        run: |
          # GITHUB_REF is already `harness-letratag-v<version>` — the tag
          # itself is the artifact stem, so don't prefix it a second time.
          TAG="${GITHUB_REF#refs/tags/}"
          echo "name=${TAG}.zip" >> "$GITHUB_OUTPUT"

      - name: Zip dist/
        working-directory: apps/harness-letratag/dist
        run: zip -r "../../../${{ steps.artifact.outputs.name }}" .

      - name: Upload as GitHub Release artifact
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.artifact.outputs.name }}
          generate_release_notes: true
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}

      - name: Notify docs site to rebuild
        # The docs site rebuilds and re-runs pull-harness-bundles to pick up
        # this new bundle. Cross-repo repository_dispatch needs a token with
        # write access to the docs repo — the built-in GITHUB_TOKEN is scoped
        # to this repo only. Create a PAT (or fine-grained token) with
        # `contents: write` on thermal-label/thermal-label.github.io and store
        # it as the DOCS_DISPATCH_TOKEN secret. If the secret is absent this
        # step is skipped — the release still succeeds and the docs site
        # picks the bundle up on its next scheduled/pushed build.
        env:
          DOCS_DISPATCH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        if: env.DOCS_DISPATCH_TOKEN != ''
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ env.DOCS_DISPATCH_TOKEN }}
          repository: thermal-label/thermal-label.github.io
          event-type: docs-update
          client-payload: '{"repo": "harness", "ref": "${{ github.ref_name }}"}'
